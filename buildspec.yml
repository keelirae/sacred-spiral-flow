version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm install

  pre_build:
    commands:
      - echo "Running type check..."
      - npm run type-check
      - echo "Running lint..."
      - npm run lint

  build:
    commands:
      - echo "Building application..."
      - npm run build

  post_build:
    commands:
      - echo "Build completed on `date`"

artifacts:
  files:
    - "dist/**/*"
  name: BuildArtifact
  discard-paths: yes

cache:
  paths:
    - "node_modules/**/*"
    - ".npm/**/*"
